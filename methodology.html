<!--
  Gap Geometry — temporary MAINTENANCE / holding page.
  Use: when reworking the site (e.g. rebuilding Repo 1), copy this whole file's contents and paste it
  over the current main-gate page (the About page). It is fully self-contained — no external files,
  no fonts, no scripts to fetch — so it works the moment it's live. Remove it (restore the real page)
  when the rework is done. Keep this file named "Maintenance" so it is never mistaken for a live page.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gap Geometry — being reworked</title>
<style>
  :root{
    --ink:#1a2233;      /* deep navy ink   */
    --muted:#5b6577;    /* soft grey       */
    --line:#e6e8ee;     /* hairline        */
    --gold:#b8892b;     /* restrained gold */
    --bg:#ffffff;       /* white           */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem;
  }
  .card{max-width:560px; width:100%; text-align:center}

  /* a quiet breathing mark: a circle with a small gap (a nod to the framework) */
  .mark{width:56px; height:56px; margin:0 auto 1.6rem; display:block}
  .mark circle{fill:none; stroke:var(--gold); stroke-width:3; stroke-linecap:round;
    stroke-dasharray:150; stroke-dashoffset:26;               /* leaves a small gap in the ring */
    transform-origin:50% 50%; animation:breathe 4.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.55; transform:rotate(0deg)} 50%{opacity:1; transform:rotate(8deg)}}

  h1{font-size:1.7rem; font-weight:600; letter-spacing:.2px; margin:0 0 .15rem}
  .sub{font-size:.82rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 1.6rem}
  .rule{width:44px; height:1px; background:var(--line); border:0; margin:1.6rem auto}
  .lead{font-size:1.06rem; line-height:1.6; margin:0 0 1rem}
  p.small{font-size:.95rem; line-height:1.65; color:var(--muted); margin:.4rem 0 0}
  p.source{font-size:.95rem; line-height:1.6; color:var(--muted); margin:1.4rem 0 0}
  p.source a{color:var(--gold); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:1px}
  p.source a:hover{border-bottom-color:var(--gold)}
  .foot{margin-top:2.2rem; font-size:.8rem; color:var(--muted)}
  @media (prefers-reduced-motion:reduce){ .mark circle{animation:none} }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r="24"></circle>
    </svg>

    <h1>Gap Geometry</h1>
    <p class="sub">The Framework</p>

    <p class="lead">This page is being reworked.</p>
    <p class="small">
      The framework and its pages are being updated, and new material is on the way.
      This is temporary — please check back in a few days.
    </p>

    <p class="source">
      In the meantime, the source stays open on
      <a href="https://github.com/Gap-geometry" rel="noopener">GitHub</a>.
    </p>

    <hr class="rule">
    <p class="foot">Thank you for your patience. — Gap&nbsp;Geometry</p>
  </main>
</body>
</html>
